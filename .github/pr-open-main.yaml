name: "Analyze & Plan Terraform"

on:
  pull_request:
    paths:
        - demo/terraform/**
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  id-tf:
    name: Generate Plans
    runs-on: ubuntu-latest
    env:
      ARM_TENANT_ID: "${{ vars.ARM_TENANT_ID }}"
      ARM_SUBSCRIPTION_ID: "${{ vars.AZURE_STORAGE_SUBSCRIPTION_ID}}"
      ARM_CLIENT_ID: "${{ secrets.ARM_CLIENT_ID_PLAN }}"
      ARM_CLIENT_SECRET: "${{ secrets.ARM_CLIENT_SECRET_PLAN }}"
      ARM_USE_AZUREAD: true
      STORAGE_ACCOUNT_NAME: "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT_NAME }}"
      STORAGE_CONTAINER_NAME: "${{ vars.AZURE_STORAGE_CONTAINER_NAME }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Terraform Init
        id: terraform-init
        env:
          DEBUG: ${{ runner.debug }}
          TF_LOG_PROVIDER: "${{ runner.debug == '1' && 'DEBUG' || 'ERROR' }}"
        run: |
          terraform init -backend-config="storage_account_name=${STORAGE_ACCOUNT_NAME}" \
                         -backend-config="container_name=${STORAGE_CONTAINER_NAME}" \
                         -backend-config="key=terraform.tfstate" \
                         -input=false \
                         -lock=false

      - name: Generate Terraform Plans
        id: generate-tf-plans
        env:
          DEBUG: ${{ runner.debug }}
          TF_LOG_PROVIDER: "${{ runner.debug == '1' && 'DEBUG' || 'ERROR' }}"
        run: |
          terraform plan -refresh=false -out=plan.tfapply -input=false -detailed-exitcode

      - name: Upload Terraform plans
        uses: actions/upload-artifact@v7
        if: steps.process-modified-files.outputs.modified-tf-env-paths != '[]'
        with:
          name: tfplan
          if-no-files-found: ignore
          path: |
            ./**/plan.tfapply
            