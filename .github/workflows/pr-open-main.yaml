name: "Analyze & Plan Terraform"

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  id-tf:
    name: Generate Plans
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/demo/terraform
    environment: "main"
    env:
      ARM_TENANT_ID: "${{ vars.ARM_TENANT_ID }}"
      ARM_SUBSCRIPTION_ID: "${{ vars.AZURE_STORAGE_SUBSCRIPTION_ID}}"
      ARM_CLIENT_ID: "${{ secrets.ARM_CLIENT_ID }}"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: true
      STORAGE_ACCOUNT_NAME: "${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT_NAME }}"
      STORAGE_CONTAINER_NAME: "${{ vars.AZURE_STORAGE_CONTAINER_NAME }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_STORAGE_SUBSCRIPTION_ID }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: terraform-init
        run: |
          terraform init -backend-config="storage_account_name=${STORAGE_ACCOUNT_NAME}" \
                         -backend-config="container_name=${STORAGE_CONTAINER_NAME}" \
                         -backend-config="key=terraform.tfstate" \
                         -input=false \
                         -lock=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Generate Terraform Plans
        id: generate-tf-plans
        run: |
          terraform plan -refresh=false -out=plan.tfapply -input=false -detailed-exitcode

      - name: Upload Terraform plans
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          if-no-files-found: ignore
          path: |
            ./**/plan.tfapply
            