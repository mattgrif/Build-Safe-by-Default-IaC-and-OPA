name: "Apply Terraform Plans"

on:
  push:
    paths:
      - demo/terraform/**
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency: terraform-apply

jobs:
  apply-plans:
    name: Apply Terraform plans
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/terraform
    environment: "main"
    env:
      ARM_TENANT_ID: "${{ vars.ARM_TENANT_ID }}"
      ARM_SUBSCRIPTION_ID: "${{ vars.AZURE_STORAGE_SUBSCRIPTION_ID}}"
      ARM_CLIENT_ID: "${{ secrets.ARM_CLIENT_ID }}"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: true
      STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT_NAME }}
      STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply Terraform plans
        id: apply-plans
        run: |
          terraform init -backend-config="storage_account_name=${STORAGE_ACCOUNT_NAME}" \
                         -backend-config="container_name=${STORAGE_CONTAINER_NAME}" \
                         -backend-config="key=terraform.tfstate" \
                         -input=false \
                         -lock=false
          terraform plan -out=plan.tfapply -input=false -detailed-exitcode
          terraform apply -input=false -auto-approve plan.tfapply
